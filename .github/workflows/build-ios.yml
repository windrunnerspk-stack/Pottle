name: Build iOS Release (Potle Finanzas)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub

jobs:
  build-ios:
    name: Build iOS App (.xcarchive / Release)
    runs-on: macos-latest # Utiliza los runners Mac de GitHub con Xcode preinstalado

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Seleccionar versión de Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Compilar proyecto Vite (Web Release)
        run: npm run build

      - name: Preparar y sincronizar proyecto nativo Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Instalar CocoaPods (si aplica)
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd ../..
          else
            echo "No se requiere CocoaPods (Capacitor usa Swift Package Manager o gestión directa)."
          fi

      - name: Compilar en modo Release con xcodebuild
        run: |
          cd ios/App
          mkdir -p ./build
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET="-workspace App.xcworkspace"
          else
            BUILD_TARGET="-project App.xcodeproj"
          fi
          xcodebuild archive \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/PotleFinanzas.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Empaquetar y generar archivo instalador .ipa (Release)
        run: |
          cd ios/App/build
          mkdir -p Payload
          # Copiar la app compilada en la carpeta Payload estándar de iOS
          cp -r PotleFinanzas.xcarchive/Products/Applications/*.app Payload/
          # Empaquetar como archivo .ipa
          zip -qr PotleFinanzas.ipa Payload
          echo "Archivo .ipa generado con éxito:"
          ls -lh PotleFinanzas.ipa
          cd ../../..

      - name: Subir archivo instalador iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: potle-finanzas-ios-ipa
          path: ios/App/build/PotleFinanzas.ipa
          retention-days: 14

      - name: Subir artefacto compilado (.xcarchive)
        uses: actions/upload-artifact@v4
        with:
          name: potle-finanzas-ios-release-archive
          path: ios/App/build/PotleFinanzas.xcarchive
          retention-days: 14
